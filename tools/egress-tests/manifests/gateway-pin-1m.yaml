# Strategic merge patch for deploy/atenet-egress in ate-system, used by the
# million-tunnel ladder (see campaign/README.md). It pins the gateway to its
# own node pool and raises Envoy's open-file limit: a tunnel costs two file
# descriptors, so a million tunnels exceed the container default of 1048576.
# Envoy still runs as 65532 with no capabilities; the wrapper only raises the
# limit before dropping privileges.
#
#   kubectl -n ate-system patch deployment atenet-egress --type strategic \
#     --patch-file tools/egress-tests/manifests/gateway-pin-1m.yaml
spec:
  template:
    spec:
      nodeSelector:
        ate.dev/pool: gateway
      tolerations:
      - key: ate.dev/gateway
        operator: Equal
        value: "true"
        effect: NoSchedule
      containers:
      - name: envoy
        command:
        - /bin/bash
        - -c
        - ulimit -HSn 8388608 && exec setpriv --reuid=65532 --regid=65532 --clear-groups --inh-caps=-all -- /usr/local/bin/envoy "$@"
        - envoy
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
            add: [SYS_RESOURCE, SETUID, SETGID]
