# Strategic merge patch deploy.sh --unpatch-gateway applies to undo
# gateway-trust-patch.yaml.tmpl, putting the egress gateway back on the public
# roots alone. The install's own server-side apply does not undo the patch.
spec:
  template:
    metadata:
      annotations:
        egress-tests.ate.dev/target-ca-sha256: null
    spec:
      initContainers:
      - name: egress-tests-trust
        $patch: delete
      containers:
      - name: envoy
        volumeMounts:
        - mountPath: /etc/ssl/certs/ca-certificates.crt
          $patch: delete
      volumes:
      - name: egress-tests-target-ca
        $patch: delete
      - name: egress-tests-ca-bundle
        $patch: delete
