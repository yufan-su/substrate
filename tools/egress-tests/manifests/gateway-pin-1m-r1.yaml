# Strategic merge patch for deploy/atenet-egress in ate-system: the
# gateway-pin-1m.yaml pin and file limit at one replica on one c3-highmem-88
# (704 GiB), for the HTTPS million-tunnel run on a single Envoy. The four
# replicas of gateway-pin-1m-r4.yaml each reached 133 GiB of working set at a
# million HTTPS tunnels, so one process is expected near 535 GiB. The memory
# request reserves the node for that one pod: no limit, so Envoy is not killed
# by a limit, and no topology spread, since there is nothing to spread.
#
#   kubectl -n ate-system patch deployment atenet-egress --type strategic \
#     --patch-file tools/egress-tests/manifests/gateway-pin-1m-r1.yaml
#
# A rollout at one replica with this request needs maxUnavailable 100%: with
# the default 25% the Deployment surges first, and a second 560Gi pod cannot
# schedule beside the running one, so the rollout never completes.
spec:
  template:
    spec:
      nodeSelector:
        ate.dev/pool: gateway
      tolerations:
      - key: ate.dev/gateway
        operator: Equal
        value: "true"
        effect: NoSchedule
      containers:
      - name: envoy
        command:
        - /bin/bash
        - -c
        - ulimit -HSn 8388608 && exec setpriv --reuid=65532 --regid=65532 --clear-groups --inh-caps=-all -- /usr/local/bin/envoy "$@"
        - envoy
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
            add: [SYS_RESOURCE, SETUID, SETGID]
        resources:
          requests:
            memory: 560Gi
