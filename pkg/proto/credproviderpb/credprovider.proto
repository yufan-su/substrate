syntax = "proto3";

package credprovider;

option go_package = "github.com/agent-substrate/substrate/pkg/proto/credproviderpb";

// CredentialProvider is the plugin API a secret backend implements so Substrate
// infrastructure (e.g. the egress gateway's credential injector) can fetch an
// external credential without Substrate storing it. A provider interprets the
// attested request context however is relevant to the store it fronts.
service CredentialProvider {
  // RequestSecret resolves a credential URI to its secret material, subject to
  // whatever authorization the provider applies to the request context.
  rpc RequestSecret(RequestSecretRequest) returns (RequestSecretResponse) {}
}

// SecretScope names the use the requested secret is being fetched for. A
// provider may authorize differently per scope.
enum SecretScope {
  SECRET_SCOPE_UNSPECIFIED = 0;
  // Injected into an actor's outbound request by the egress gateway.
  SECRET_SCOPE_EGRESS_CREDENTIAL_INJECTION = 1;
}

// SecretRequestContext is the attested context Substrate passes with a request.
// The provider is trusted to have authenticated the caller (mutual TLS); the
// caller is trusted to have attested the actor identity.
message SecretRequestContext {
  // The scope the secret is requested for.
  SecretScope scope = 1;

  // The attested actor identity on whose behalf the secret is fetched. Today
  // this is the actor's SPIFFE URI as verified by the egress gateway; a
  // verifiable Actor JWT is the intended future form.
  string actor_identity = 2;

  // The egress destination hostname, so a provider can authorize a credential
  // per origin (e.g. "this key is only for api.example.com"). Empty when the
  // scope has no destination.
  string destination = 3;
}

// RequestSecretRequest asks a provider to resolve one credential URI.
message RequestSecretRequest {
  // A substrate-secret:// URI:
  //   substrate-secret://<provider class>/<provider name>/<provider tail>
  string uri = 1;

  // The attested context for the request.
  SecretRequestContext context = 2;
}

// RequestSecretResponse carries the resolved secret material.
message RequestSecretResponse {
  // The raw secret bytes. The caller decides how to use them (e.g. as a bearer
  // token); the provider does not format them.
  bytes secret = 1;
}
