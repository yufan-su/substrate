# A credprovider instance backed by Google Cloud Secret Manager: a gRPC service
# that resolves substrate-secret:// URIs of the secretmanager.googleapis.com
# class. The URI path is a Secret Manager version resource name and the secret
# payload is a JSON object mapping upstream host -> {header: value}; the provider
# returns the value the injector's target host and header select.
#
# It authenticates to Secret Manager with Workload Identity Federation, granting
# IAM directly to this ServiceAccount's principal — no intermediate Google
# service account. Grant roles/secretmanager.secretAccessor on each secret it may
# read to:
#
#   principal://iam.googleapis.com/projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/PROJECT_ID.svc.id.goog/subject/ns/ate-system/sa/credprovider-secretmanager
#
# (keyed to the project NUMBER, not the ID). Substrate never stores the secret;
# it only brokers a read the provider's identity is authorized to perform.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: credprovider-secretmanager
  namespace: ate-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: credprovider-secretmanager
  namespace: ate-system
  labels:
    app: credprovider-secretmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: credprovider-secretmanager
  template:
    metadata:
      labels:
        app: credprovider-secretmanager
    spec:
      serviceAccountName: credprovider-secretmanager
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
      containers:
      - name: credprovider
        image: ko://github.com/agent-substrate/substrate/cmd/credprovider
        args:
        - "--backend=secretmanager"
        - "--listen-address=:50051"
        - "--metrics-address=:9090"
        # Serve with the pod's servicedns identity (SAN
        # credprovider-secretmanager.ate-system.svc) and require the injector to
        # present a podidentity client cert.
        - "--server-cred-bundle=/run/servicedns.podcert.ate.dev/credential-bundle.pem"
        - "--client-ca-file=/run/podidentity.podcert.ate.dev/trust-bundle.pem"
        - "--log-level=info"
        ports:
        - name: grpc
          containerPort: 50051
        - name: metrics
          containerPort: 9090
        readinessProbe:
          httpGet:
            path: /readyz
            port: metrics
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: servicedns
          mountPath: /run/servicedns.podcert.ate.dev
          readOnly: true
        - name: podidentity
          mountPath: /run/podidentity.podcert.ate.dev
          readOnly: true
      volumes:
      - name: servicedns
        projected:
          sources:
          - podCertificate:
              signerName: servicedns.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
          - clusterTrustBundle:
              signerName: servicedns.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
      - name: podidentity
        projected:
          sources:
          - podCertificate:
              signerName: podidentity.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
          - clusterTrustBundle:
              signerName: podidentity.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
---
apiVersion: v1
kind: Service
metadata:
  name: credprovider-secretmanager
  namespace: ate-system
spec:
  type: ClusterIP
  selector:
    app: credprovider-secretmanager
  ports:
  - name: grpc
    port: 50051
    targetPort: grpc
    protocol: TCP
