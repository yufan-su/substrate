# The Google Cloud Secret Manager credential provider: a gRPC service that
# resolves ate-secret:// URIs of the secretmanager.googleapis.com provider to
# values held in Secret Manager. It is a drop-in alternative to
# k8s-credential-provider; the egress gateway dials whichever one the install's
# --credential-provider-name and --credential-provider-address select. It needs
# no Kubernetes Secret access: its only credential-store access is Secret
# Manager, reached with the ServiceAccount's Workload Identity. See
# cmd/credential-provider/gcp-secret-manager/README.md for the IAM grant.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gsm-credential-provider
  namespace: ate-system
  # Workload Identity Federation for GKE grants Secret Manager access to this
  # ServiceAccount's IAM principal directly, with no annotation. To impersonate
  # a Google service account instead, annotate it:
  # annotations:
  #   iam.gke.io/gcp-service-account: gsm-credential-provider@PROJECT_ID.iam.gserviceaccount.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gsm-credential-provider
  namespace: ate-system
  labels:
    app: gsm-credential-provider
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gsm-credential-provider
  template:
    metadata:
      labels:
        app: gsm-credential-provider
    spec:
      serviceAccountName: gsm-credential-provider
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
      containers:
      - name: gsm-credential-provider
        image: ko://github.com/agent-substrate/substrate/cmd/credential-provider/gcp-secret-manager
        args:
        - "--listen-address=:50051"
        - "--metrics-address=:9090"
        # Serve with the pod's servicedns identity (SAN gsm-credential-provider.ate-system.svc)
        # and require the injector to present a podidentity client cert whose chain
        # verifies against the trust bundle. The provider additionally pins the
        # caller's SAN to the egress gateway's identity
        # (spiffe://cluster.local/ns/ate-system/sa/atenet-egress), so no other
        # CA-trusted workload can fetch secrets.
        - "--server-cred-bundle=/run/servicedns.podcert.ate.dev/credential-bundle.pem"
        - "--client-ca-file=/run/podidentity.podcert.ate.dev/trust-bundle.pem"
        - "--log-level=info"
        ports:
        - name: grpc
          containerPort: 50051
        - name: metrics
          containerPort: 9090
        readinessProbe:
          httpGet:
            path: /readyz
            port: metrics
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: servicedns
          mountPath: /run/servicedns.podcert.ate.dev
          readOnly: true
        - name: podidentity
          mountPath: /run/podidentity.podcert.ate.dev
          readOnly: true
      volumes:
      - name: servicedns
        projected:
          sources:
          - podCertificate:
              signerName: servicedns.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
          - clusterTrustBundle:
              signerName: servicedns.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
      - name: podidentity
        projected:
          sources:
          - podCertificate:
              signerName: podidentity.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
          - clusterTrustBundle:
              signerName: podidentity.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
---
apiVersion: v1
kind: Service
metadata:
  name: gsm-credential-provider
  namespace: ate-system
spec:
  type: ClusterIP
  selector:
    app: gsm-credential-provider
  ports:
  - name: grpc
    port: 50051
    targetPort: grpc
    protocol: TCP
