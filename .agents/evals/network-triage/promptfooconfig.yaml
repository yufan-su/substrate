# Evals for the network-triage skill. Run them with run.sh, which sets
# EVAL_DIR to a temp directory that holds only the skill.
description: network-triage

providers:
  - id: anthropic:claude-agent-sdk
    config:
      model: claude-sonnet-5-5
      apiKeyRequired: false
      working_dir: '{{ env.EVAL_DIR }}'
      setting_sources: ['project']
      skills: ['network-triage']
      disallowed_tools: ['Bash', 'WebFetch', 'WebSearch']
      max_turns: 30

prompts:
  - |
    Triage this support ticket. You have no cluster access, and nobody can
    answer questions. Use only the evidence in the ticket, and finish with the
    report.

    {{ticket}}

tests: file://cases.yaml

defaultTest:
  options:
    # Keep root_cause lists whole; by default each list item becomes its own test.
    disableVarExpansion: true
  assert:
    - type: skill-used
      value: network-triage
    - type: javascript
      value: file://grade.js
